<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Browser Games Hub</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:20px;font-family:Segoe UI,Tahoma,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);min-height:100vh;color:#fff}.container{max-width:1200px;margin:auto}header{position:relative;text-align:center;padding:25px 300px 35px 20px}h1{font-size:clamp(2rem,5vw,3rem);margin:0 0 10px;text-shadow:2px 2px 4px #0005}header p{font-size:1.1rem;margin:0;opacity:.9}.search-box{position:absolute;right:0;top:28px;display:flex;gap:6px;width:280px}.search-box input{width:100%;padding:12px 14px;border:0;border-radius:8px;font-size:1rem;outline:0}.search-box button{border:0;border-radius:8px;padding:0 13px;background:#764ba2;color:#fff;font-size:1.1rem;cursor:pointer}.search-box button:hover{background:#5b3788}.category-title{font-size:1.7rem;margin:30px 0 18px;padding-bottom:9px;border-bottom:2px solid #ffffff4d}.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}.game-card{background:#fff;color:#333;border-radius:10px;overflow:hidden;box-shadow:0 8px 16px #0003;transition:.25s}.game-card:hover{transform:translateY(-7px);box-shadow:0 12px 24px #0005}.game-image{height:125px;display:flex;align-items:center;justify-content:center;font-size:3rem;background:linear-gradient(135deg,#667eea,#764ba2)}.game-content{padding:18px}.game-content h3{margin:0 0 8px;font-size:1.25rem}.game-content p{color:#666;line-height:1.45;margin:0 0 14px}.play-btn{display:inline-block;padding:10px 18px;border-radius:5px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-decoration:none;font-weight:700}.play-btn:hover{opacity:.85}.no-results{display:none;text-align:center;padding:35px;background:#ffffff1a;border-radius:10px;font-size:1.2rem}footer{text-align:center;margin-top:45px;padding:25px;border-top:1px solid #ffffff33;opacity:.8}@media(max-width:700px){header{padding:20px 10px 105px}.search-box{top:auto;bottom:25px;left:10%;right:10%;width:80%}}
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎮 Browser Games Hub</h1>
    <p>Play amazing games directly in your browser — no downloads needed!</p>
    <form class="search-box" id="searchForm" role="search">
      <input id="gameSearch" type="search" placeholder="Search games..." aria-label="Search games">
      <button type="submit" aria-label="Search">🔍</button>
    </form>
  </header>
  <main id="gameSections"></main>
  <div class="no-results" id="noResults">No games found. Try another search.</div>
  <footer><p>© 2024 Browser Games Hub. All games link to their respective websites.</p><p>Made with ❤️ — No affiliation with game creators</p></footer>
</div>
<script>
const sections=[
['⭐ Featured Games',[['👊','Super Smash Flash 2','Fan-made fighting game with tons of characters.','https://www.supersmashflash.com'],['🚴','Happy Wheels','Physics-based racing with hilarious ragdoll characters.','https://www.totaljerkface.com/happywheels.php']]],
['⛏️ Minecraft-Like Games',[['⛏️','Eaglercraft','Play Minecraft directly in your browser.','https://eaglercraft.com'],['🏗️','ClassiCube','Classic Minecraft-style experience.','https://classicube.net'],['🎮','bloxd.io','Voxel multiplayer game with building and minigames.','https://bloxd.io'],['🧱','Mine Blocks','2D Minecraft-style crafting and building.','https://mineblocks.com'],['🌎','Minetest','Open-source voxel game engine.','https://minetest.net'],['📦','Roblox','Thousands of user-created multiplayer games.','https://www.roblox.com']]],
['👷 Sandbox & Building Games',[['👥','Tribals.io','Craft, survive, and build with your tribe.','https://tribals.io'],['🌍','Polytoria','Multiplayer sandbox and creation tools.','https://polytoria.com'],['🎨','Gartic Phone','Draw and guess with friends.','https://garticphone.com'],['🎪','Skribbl.io','Online drawing and guessing game.','https://skribbl.io'],['🏗️','Paper Minecraft','2D Minecraft-style survival and creative modes.','https://paperminecraft.com'],['🌊','HyperCasual.io','A collection of quick browser games.','https://itch.io/games/free/platform-web']]],
['⚔️ Action & Battle Games',[['⚔️','Diep.io','Upgrade your tank and battle online.','https://diep.io'],['🍔','Agar.io','Grow your cell by eating others.','https://agar.io'],['🐍','Slither.io','Grow your snake against players worldwide.','https://slither.io'],['🎯','Geometry Dash','Rhythm platformer with challenging obstacles.','https://gamedistribution.com/games/geometry-dash'],['🔫','Krunker','Fast-paced multiplayer browser FPS.','https://krunker.io'],['💣','ZombsRoyale','Zombie battle royale action.','https://zombsroyale.io']]],
['🏎️ Racing Games',[['🏎️','Madalin Stunt Cars','Drive exotic cars on huge stunt tracks.','https://madalinstuntcars.com'],['🏁','Car Parking Multiplayer','Park and customize cars online.','https://carparkingmultiplayer.com'],['🚗','Drift Hunters','Collect cars and master drifting.','https://drifthunters.io'],['🏎️','Super Drift','Fast drifting game with multiplayer modes.','https://gamedistribution.com/games/super-drift'],['🚙','Voxel Racing','Discover free voxel-style racing games.','https://itch.io/games/free/platform-web/tag-racing'],['🚁','War Plane','Fly and compete in browser combat games.','https://gamedistribution.com/games/war-plane']]],
['🧩 Puzzle & Strategy Games',[['♟️','Chess.com','Play chess and improve your skills.','https://chess.com'],['🧩','Tetris','Classic block-stacking puzzle game.','https://tetris.com'],['2048','2048','Combine tiles and reach 2048.','https://2048game.com'],['🎮','Wordle','Guess the word in six tries.','https://www.nytimes.com/games/wordle/'],['🔲','Sudoku','Solve classic number puzzles.','https://sudoku.com'],['🎯','Cookie Clicker','Build your cookie empire.','https://orteil.dashnet.org/cookieclicker/']]],
['⚽ Sports Games',[['⚽','Soccer Physics','Funny physics-based soccer matches.','https://gamedistribution.com/games/soccer-physics'],['🏀','Basketball Stars','Shoot hoops and score points.','https://gamedistribution.com/games/basketball-stars'],['🎾','Tennis Masters','Play online tennis matches.','https://gamedistribution.com/games/tennis-masters'],['🏌️','Mini Golf','Play mini golf with friends.','https://itch.io/games/free/platform-web/tag-sports'],['⚾','Baseball Games','Play browser baseball games.','https://gamedistribution.com/games/baseball-superstars'],['🥊','Boxing Random','Punch, dodge, and win.','https://boxingrandom.com']]],
['🗡️ Adventure & RPG Games',[['🗡️','Slime Dungeon','Explore dungeons and fight monsters.','https://itch.io/games/free/platform-web/tag-rpg'],['🧛','Town of Salem','Strategic social deduction game.','https://www.blankmediagames.com'],['🏰','Kingdom Rush','Defend your kingdom with tower defense.','https://www.kongregate.com/games/Ironhide/kingdom-rush'],['🌙','Realm of the Mad God','Bullet-hell MMO roguelike adventure.','https://www.realmofthemadgod.com'],['🧙','Wizard Games','Discover free browser RPG adventures.','https://itch.io/games/free/platform-web/tag-rpg']]],
['🎲 More Games to Explore',[['🎯','Itch.io','Thousands of free indie browser games.','https://itch.io/games/free/platform-web'],['🎮','Kongregate','Classic and modern online games.','https://www.kongregate.com'],['🕹️','Game Jolt','A library of indie games.','https://gamejolt.com'],['🎪','Newgrounds','Classic and new browser games.','https://www.newgrounds.com'],['⭐','Cool Math Games','Games and brain-boosting puzzles.','https://www.coolmathgames.com'],['🎨','Pogo','Classic and modern online games.','https://www.pogo.com']]]
];
const root=document.getElementById('gameSections');
sections.forEach(([category,games])=>{const title=document.createElement('h2');title.className='category-title';title.textContent=category;const grid=document.createElement('div');grid.className='games-grid';games.forEach(([icon,name,description,url])=>{const card=document.createElement('article');card.className='game-card';card.dataset.search=(name+' '+description+' '+category).toLowerCase();card.innerHTML=`<div class="game-image">${icon}</div><div class="game-content"><h3>${name}</h3><p>${description}</p><a class="play-btn" href="${url}" target="_blank" rel="noopener noreferrer">Play Now</a></div>`;grid.appendChild(card)});root.append(title,grid)});
const cards=[...document.querySelectorAll('.game-card')],noResults=document.getElementById('noResults'),search=document.getElementById('gameSearch');
function filterGames(){const query=search.value.trim().toLowerCase();let visible=0;cards.forEach(card=>{const match=!query||card.dataset.search.includes(query);card.style.display=match?'':'none';if(match)visible++});document.querySelectorAll('.category-title').forEach(title=>{const grid=title.nextElementSibling;title.style.display=[...grid.children].some(card=>card.style.display!=='none')?'':'none';grid.style.display=[...grid.children].some(card=>card.style.display!=='none')?'':'none'});noResults.style.display=visible?'none':'block'}
search.addEventListener('input',filterGames);document.getElementById('searchForm').addEventListener('submit',e=>e.preventDefault());
</script>
</body>
</html>
