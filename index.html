<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser Games Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Segoe UI,Tahoma,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);min-height:100vh;color:#fff}.container{max-width:1200px;margin:auto}header{position:relative;text-align:center;padding:25px 300px 35px 20px}h1{font-size:clamp(2rem,5vw,3rem);margin:0 0 10px;text-shadow:2px 2px 4px #0005}header p{font-size:1.1rem;margin:0;opacity:.9}.search-box{position:absolute;right:0;top:28px;display:flex;gap:6px;width:280px}.search-box input{width:100%;padding:12px 14px;border:0;border-radius:8px;font-size:1rem;outline:0}.search-box button{border:0;border-radius:8px;padding:0 13px;background:#764ba2;color:#fff;font-size:1.1rem;cursor:pointer}.category-title{font-size:1.7rem;margin:30px 0 18px;padding-bottom:9px;border-bottom:2px solid #ffffff4d}.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}.game-card{background:#fff;color:#333;border-radius:10px;overflow:hidden;box-shadow:0 8px 16px #0003;transition:.25s}.game-card:hover{transform:translateY(-7px);box-shadow:0 12px 24px #0005}.game-image{height:125px;display:flex;align-items:center;justify-content:center;font-size:3rem;background:linear-gradient(135deg,#667eea,#764ba2)}.game-content{padding:18px}.game-content h3{margin:0 0 8px;font-size:1.25rem}.game-content p{color:#666;line-height:1.45;margin:0 0 14px}.play-btn{display:inline-block;padding:10px 18px;border-radius:5px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-decoration:none;font-weight:700}.play-btn:hover{opacity:.85}.no-results{display:none;text-align:center;padding:35px;background:#ffffff1a;border-radius:10px;font-size:1.2rem}footer{text-align:center;margin-top:45px;padding:25px;border-top:1px solid #ffffff33;opacity:.8}@media(max-width:700px){header{padding:20px 10px 105px}.search-box{top:auto;bottom:25px;left:10%;right:10%;width:80%}}
</style>
</head>
<body><div class="container"><header><h1>🎮 Browser Games Hub</h1><p>Play amazing games directly in your browser — no downloads needed!</p><form class="search-box" id="searchForm"><input id="gameSearch" type="search" placeholder="Search games..." aria-label="Search games"><button type="submit" aria-label="Search">🔍</button></form></header><main id="gameSections"></main><div class="no-results" id="noResults">No games found. Try another search.</div><footer><p>© 2024 Browser Games Hub. Game links go to their respective sites.</p><p>Made with ❤️ — No affiliation with game creators</p></footer></div>
<script>
const searchSite=q=>'https://www.crazygames.com/search?q='+encodeURIComponent(q);
const sections=[
['⭐ Featured Games',[
['👊','Super Smash Flash 2','Fan-made platform fighting game with a huge roster.','https://www.supersmashflash.com/'],['🚴','Happy Wheels','Physics-based obstacle courses with ridiculous vehicles.','https://www.totaljerkface.com/happywheels.php'],['⛏️','Eaglercraft','Minecraft-style building and survival in your browser.','https://eaglercraft.com'],['🏗️','ClassiCube','Classic block-building multiplayer worlds.','https://classicube.net']]],
['🥊 30 Fighting Games',[
['🥊','Superfighters','Fast 2D platform fighting with weapons and chaos.',searchSite('Superfighters')],['👊','Ragdoll.io','Physics-based arena battles.',searchSite('Ragdoll fighting')],['⚔️','Sword Masters','Battle enemies and upgrade your fighter.',searchSite('Sword Masters')],['🦸','Hero Wars','Hero-versus-hero fantasy combat.',searchSite('Hero fighting')],['🥋','Karate Bros','One-on-one martial-arts battles.',searchSite('Karate Bros')],['🤼','Wrestle Bros','Multiplayer wrestling matches.',searchSite('Wrestle Bros')],['🦾','Robot Fighting','Battle customizable robots.',searchSite('Robot fighting')],['⚡','Stickman Fighting','Quick stick-figure arena fights.',searchSite('Stickman fighting')],['🗡️','Narrow One','Archery duels with medieval combat.',searchSite('Narrow One')],['🛡️','Castel Wars','Pixel-art castle battles.',searchSite('Castel Wars')],['🧙','Magic Survival','Use spells to defeat waves of enemies.',searchSite('Magic fighting')],['🐉','Dragon Fist','Martial-arts adventure battles.',searchSite('Dragon fighting')],['🥷','Ninja Clash','Fast ninja arena combat.',searchSite('Ninja fighting')],['🧟','Zombie Brawl','Survive close-range zombie fights.',searchSite('Zombie brawl')],['🤠','Gun Mayhem','Knock opponents off the arena.',searchSite('Gun Mayhem')],['🏹','Bowmasters','Aim, shoot, and duel opponents.',searchSite('Bowmasters')],['🦸','Hero 3 Flying Robot','Superhero-style flying combat missions.',searchSite('Flying superhero')],['🦸‍♂️','Superhero City','Explore a city and fight villains.',searchSite('Superhero city')],['🕷️','Spider Hero','Swing, dodge, and battle enemies.',searchSite('Spider hero')],['🦸‍♀️','Power Surge','Use superhero powers in arena battles.',searchSite('Superhero powers')],['🔥','Fireboy Arena','Elemental fighting challenges.',searchSite('Elemental fighting')],['🌪️','Ragdoll Hit','Launch fighters through obstacle arenas.',searchSite('Ragdoll Hit')],['🥷','Ninja.io','Fast multiplayer ninja battles.',searchSite('Ninja.io')],['🧱','Brawlers.io','Online brawler arena matches.',searchSite('Brawlers.io')],['⚔️','Stickman Warriors','Stickman sword-fighting battles.',searchSite('Stickman Warriors')],['🏰','Medieval Battle','Knights fight for the castle.',searchSite('Medieval battle')],['🤖','Mech Arena','Heavy robot-versus-robot combat.',searchSite('Mech arena')],['🐲','Monster Arena','Fight monsters and other players.',searchSite('Monster arena')],['👽','Alien Brawl','Survive an alien battle arena.',searchSite('Alien brawl')],['💥','Battle Wheels','Vehicle combat and stunt battles.',searchSite('Battle Wheels')]]],
['🔫 30 Shooting, FPS & Flying Games',[
['🎯','Shell Shockers','Egg-themed multiplayer first-person shooter.','https://shellshockers.io'],['🔫','Krunker','Fast browser FPS with multiple game modes.','https://krunker.io'],['🎯','Venge.io','Competitive online FPS with abilities.',searchSite('Venge.io')],['💣','ZombsRoyale','Top-down battle royale with weapons.', 'https://zombsroyale.io'],['🔫','War Brokers','Blocky multiplayer shooter with vehicles.',searchSite('War Brokers')],['🎯','Bullet Force','Modern multiplayer FPS battles.',searchSite('Bullet Force')],['🪖','Forward Assault','Tactical counter-strike-style shooter.',searchSite('Forward Assault')],['🎯','Combat Reloaded','Team-based online FPS combat.',searchSite('Combat Reloaded')],['🔫','Deadshot.io','Fast competitive browser FPS.',searchSite('Deadshot.io')],['🪖','Mini Royale Nations','Tactical battle royale shooter.',searchSite('Mini Royale Nations')],['🎯','BuildNow GG','Build and shoot in creative arenas.',searchSite('BuildNow GG')],['🔫','1v1.LOL','Build, edit, and duel opponents.',searchSite('1v1.LOL')],['🎯','Ev.io','Sci-fi multiplayer arena shooter.',searchSite('Ev.io')],['🔫','Voxiom.io','Voxel FPS with building and destruction.',searchSite('Voxiom.io')],['🪖','Repuls.io','Large multiplayer sci-fi shooter.',searchSite('Repuls.io')],['🎯','Masked Forces','Team-based tactical shooting missions.',searchSite('Masked Forces')],['🔫','Combat Online','Classic multiplayer gun battles.',searchSite('Combat Online')],['🎯','Pixel Warfare','Pixel-art FPS with online matches.',searchSite('Pixel Warfare')],['🔫','Time Shooter','Slow-motion tactical shooting puzzles.',searchSite('Time Shooter')],['🎯','Getaway Shootout','Funny two-player shooting races.',searchSite('Getaway Shootout')],['🛩️','Air Wars 2','Multiplayer airplane dogfights.',searchSite('Air Wars 2')],['✈️','Wings.io','Fly, shoot, and survive in the sky.',searchSite('Wings.io')],['🚁','Helicopter Attack','Pilot a helicopter through combat missions.',searchSite('Helicopter Attack')],['🦸','Hero 3 Flying Robot','Fly over the city and stop enemy threats.',searchSite('Hero 3 Flying Robot')],['🦸‍♂️','Flying Superhero','Use flight and superpowers to protect a city.',searchSite('Flying Superhero')],['🛸','Space.io','Multiplayer space shooting battles.',searchSite('Space.io shooter')],['🚀','Space Battle','Pilot a ship and destroy enemy fleets.',searchSite('Space Battle')],['🛩️','Sky Riders','Air racing and aerial combat challenges.',searchSite('Sky Riders')],['🎯','Sniper Shot','Precision shooting and stealth missions.',searchSite('Sniper Shot')],['🔫','Armed Forces','Military shooting missions and target practice.',searchSite('Armed Forces shooter')]]],
['🏎️ Racing Games', [['🏎️','Madalin Stunt Cars','Drive exotic cars on huge stunt tracks.','https://madalinstuntcars.com'],['🚗','Drift Hunters','Collect cars and master drifting.','https://drifthunters.io'],['🏁','City Car Stunt','Extreme stunt driving challenges.',searchSite('City Car Stunt')],['🏍️','Moto X3M','Motorcycle stunts and obstacle courses.',searchSite('Moto X3M')]]],
['🧩 Puzzle & Strategy Games', [['♟️','Chess.com','Play chess online and improve your skills.','https://chess.com'],['🧩','Tetris','Classic block-stacking puzzle game.','https://tetris.com'],['🔢','2048','Combine tiles and reach 2048.','https://2048game.com'],['🍪','Cookie Clicker','Build your cookie empire.','https://orteil.dashnet.org/cookieclicker/']]],
['👷 Sandbox & Multiplayer Games', [['🌍','Polytoria','Multiplayer sandbox and creation tools.','https://polytoria.com'],['🎨','Gartic Phone','Draw and guess with friends.','https://garticphone.com'],['🎪','Skribbl.io','Online drawing and guessing game.','https://skribbl.io'],['📦','Roblox','Thousands of user-created multiplayer games.','https://www.roblox.com'],['🌎','Minetest','Open-source voxel game engine.','https://minetest.net']]]
];
const root=document.getElementById('gameSections');
sections.forEach(([category,games])=>{const title=document.createElement('h2');title.className='category-title';title.textContent=category;const grid=document.createElement('div');grid.className='games-grid';games.forEach(([icon,name,description,url])=>{const card=document.createElement('article');card.className='game-card';card.dataset.search=(name+' '+description+' '+category).toLowerCase();card.innerHTML=`<div class="game-image">${icon}</div><div class="game-content"><h3>${name}</h3><p>${description}</p><a class="play-btn" href="${url}" target="_blank" rel="noopener noreferrer">Play Now</a></div>`;grid.appendChild(card)});root.append(title,grid)});
const cards=[...document.querySelectorAll('.game-card')],noResults=document.getElementById('noResults'),search=document.getElementById('gameSearch');
function filterGames(){const query=search.value.trim().toLowerCase();let visible=0;cards.forEach(card=>{const match=!query||card.dataset.search.includes(query);card.style.display=match?'':'none';if(match)visible++});document.querySelectorAll('.category-title').forEach(title=>{const grid=title.nextElementSibling;const hasVisible=[...grid.children].some(card=>card.style.display!=='none');title.style.display=hasVisible?'':'none';grid.style.display=hasVisible?'':'none'});noResults.style.display=visible?'none':'block'}
search.addEventListener('input',filterGames);document.getElementById('searchForm').addEventListener('submit',e=>e.preventDefault());
</script></body></html>
